<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LnwLiveSHTIK — ระบบจัดการไลฟ์สด TikTok</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      width: 360px;
      min-height: 480px;
      max-height: 580px;
      overflow-y: auto;
    }
    .popup-wrapper {
      padding: 12px;
    }
    .popup-logo-img {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <img src="assets/logo.png" alt="LnwLiveSHTIK" class="popup-logo-img">
        <div>
          <div class="brand-title">
            LnwLiveSHTIK
            <span class="brand-badge">v4.0 Pro</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-icon" id="btnOpenDashboard" title="เปิดหน้าจอแดชบอร์ดเต็มจอ"></button>
        <button class="btn btn-secondary btn-icon" id="btnOpenSidePanel" title="ตรึงบนแถบด้านข้าง (Side Panel)"></button>
      </div>
    </header>

    <div class="popup-wrapper">
      <!-- สรุปสถานะสตรีมมิ่ง TikTok Live -->
      <div class="grid-2" style="margin-bottom: 12px;">
        <div class="stat-box">
          <div class="stat-label">สถานะ TikTok Live Ingest</div>
          <div class="stat-value live" id="valTikTokStatus">พร้อมทำงาน</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">จอ TikTok ที่ใช้งาน</div>
          <div class="stat-value emerald" id="valTikTokQuota">1 จอออนไลน์</div>
        </div>
      </div>

      <!-- รายการสตรีม TikTok ที่กำลังออนไลน์สด -->
      <div class="card">
        <div class="card-header">
          <span class="card-title" id="titleActiveStreams">สถานะการถ่ายทอดสด TikTok Live</span>
          <button class="btn btn-secondary btn-sm" id="btnRefreshStats">รีเฟรช</button>
        </div>
        <div id="activeStreamsList">
          <div style="text-align: center; color: var(--text-dim); padding: 12px 0;">
            กำลังตรวจสอบสถานะการไลฟ์สด...
          </div>
        </div>
      </div>

      <!-- ซิงค์เซสชัน Cookie จากแท็บ TikTok ปัจจุบัน -->
      <div class="card">
        <div class="card-header">
          <span class="card-title" id="titleTabSync">ซิงค์เซสชันเบราว์เซอร์ TikTok</span>
        </div>
        <div id="tabSyncInfo" class="cookie-pill">
          <div class="cookie-pill-info">
            <span id="tabSyncIcon"></span>
            <span id="tabSyncText">กำลังตรวจจับแท็บ TikTok ปัจจุบัน...</span>
          </div>
          <button class="btn btn-primary btn-sm" id="btnQuickSync">ซิงค์ TikTok</button>
        </div>
      </div>

      <!-- ปุ่มเปิดใช้งานสตูดิโอ -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-primary" id="btnLaunchSidePanel" style="width: 100%; padding: 10px;">
          <span id="iconLaunchSidePanel"></span> เปิดแถบควบคุม Side Panel
        </button>
        <button class="btn btn-secondary" id="btnLaunchFullDashboard" style="width: 100%;">
          <span id="iconLaunchDashboard"></span> เปิดศูนย์บัญชาการหลายจอ (Dashboard)
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
